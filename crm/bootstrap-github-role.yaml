AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup. Lets GitHub Actions (main branch of USA-design/familytransitionsinc only) deploy the
  Family Transitions CRM with short-lived credentials. No AWS keys are stored in GitHub.

Parameters:
  GitHubSubject:
    Type: String
    Description: The "sub" claim GitHub sends for the main branch (GitHub's newer format includes owner and repo IDs).
    Default: repo:USA-design@194518513/familytransitionsinc@1472255797:ref:refs/heads/main
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Choose false if this AWS account already has the GitHub OIDC provider (token.actions.githubusercontent.com).

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fti-crm-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: manage-crm-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PassRole, iam:TagRole, iam:UntagRole, iam:UpdateRole,
                  iam:AttachRolePolicy, iam:DetachRolePolicy, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/fti-crm-*

Outputs:
  RoleArn:
    Description: Save this in GitHub as the repository variable AWS_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
